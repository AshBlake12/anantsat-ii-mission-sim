# 3U hyperspectral CubeSat - mission simulation configuration
#
# Tags follow MISSION.md:  [S] sourced   [D] derived   [A] assumption (overrule me)
# Units are in the key names. Lines starting with # are comments.

[simulation]
start_utc          = 2027-03-21T00:00:00   # [A] epoch (UTC)
duration_hours     = 48                    # length of the run
dt_s               = 2                     # executor step (power, attitude, data)
output_every_s     = 10                    # sampling of timeline.csv / viewer
orbit_substep_s    = 1                     # RK4 internal step for the orbit

[orbit]
altitude_km        = 500      # [A] A1 in MISSION.md
eccentricity       = 0.0
sun_synchronous    = true     # inclination computed from the J2 SSO condition
# inclination_deg  = 97.4     # used only when sun_synchronous = false
ltan_hours         = 10.5     # [A] A8: mid-morning LTAN (10:30)
# raan_deg         = 0        # overrides LTAN if given
arg_perigee_deg    = 0
arg_latitude_deg   = 0        # initial position along the orbit (0 = ascending node)
zonal_degree       = 6        # gravity: J2..J<n>, n <= 6
drag               = true
drag_cd            = 2.2
mass_kg            = 4.0      # [A] typical 3U with deployables
# drag_area_m2     = 0.06     # default: mean projected area from the geometry
density_scale      = 1.0      # >1 for high solar activity

[geometry]
# Body frame: +Z along the 3U long axis. Panels hinge at the hinge_end.
# Deploy angle from stowed: 0 = flat on the side, 90 = straight out (cells face
# hinge_end), 135 = swept 45 deg further (cells tilt 45 deg inward, a cup).
body_width_m       = 0.100
body_length_m      = 0.3405
panel_width_m      = 0.098
panel_length_m     = 0.311
hinge_end          = +Z
panel_angles_deg   = 135, 135, 135, 135   # panels on +X, +Y, -X, -Y
failed_panels      = 0, 0, 0, 0       # 1 = panel never deploys (stays stowed). TPP OI-30: run 1 and 2 failed too
cells_front        = 7          # [A] 3U panel = 7 x 3G30C-class cells
cells_back         = 7          # [A] double-sided (0 for single-sided)
cell_area_cm2      = 30.18      # [S] Azur Space 3G30C cell area
body_cells         = 0, 0, 0, 0, 0, 0     # cells on +X,-X,+Y,-Y,+Z,-Z body faces
shadow_samples_u   = 12         # ray-cast grid per face (along length)
shadow_samples_v   = 6          # (across width)

[solar]
cell_efficiency    = 0.295      # [S] 3G30C BOL AM0, ~29.5 %
ref_temp_c         = 28
temp_coeff_per_k   = -0.0023    # [A] relative Pmp coefficient for triple junction
iam_ar             = 0.16       # Martin & Ruiz angular loss
iam_diffuse        = 0.90
derate             = 0.95       # [A] wiring, mismatch, cover-glass
degradation        = 1.00       # 1.0 = BOL; e.g. 0.93 after a few years
mppt_efficiency    = 0.93       # [A]
include_albedo     = true
earth_albedo       = 0.30       # [S] CERES global mean
earth_ir_wm2       = 237        # [S] outgoing longwave, global mean
earth_grid_rings   = 32
earth_grid_sectors = 64

[thermal]
panel_mass_kg      = 0.14       # [A] double-sided 3U deployable panel
panel_cp           = 900        # J/kg/K, aluminium/FR4 average
alpha_front        = 0.92
eps_front          = 0.85
alpha_back         = 0.92
eps_back           = 0.85
initial_temp_c     = 20
body_temp_c        = 20         # used for body-mounted cells

[battery]
capacity_wh        = 40         # [A] 2S2P 18650. TPP v03 options: 2S4P ~100 Wh (needs a 1-4S BMS) or 3S2P ~75 Wh (BQ76952 is 3S-16S) - OI-09
nominal_v          = 7.4        # [A] 2S Li-ion; use 10.8 for 3S2P. Sets Vsys rail currents
initial_soc        = 0.80
charge_eff         = 0.95
discharge_eff      = 0.95
max_charge_w       = 20
max_discharge_w    = 40
min_soc_imaging    = 0.50       # won't start an imaging task below this
min_soc_downlink   = 0.35
safe_soc           = 0.25       # enter safe mode (sun-point, payload off)
safe_exit_soc      = 0.40

[loads]
# --- EPS board: SAMD21G18 microcontroller (timers, beacon, B-dot detumbling) ---
eps_mcu_w          = 0.03       # [A] SAMD21 @48 MHz; datasheet core <35 uA/MHz -> ~6 mW + peripherals
eps_board_w        = 0.15       # [A] regulators, sensing, MPPT quiescent
other_w            = 0.10       # [A] housekeeping sensors
# --- UHF beacon: RFM96W (SX1276) + turnstile ---
beacon_tx_w        = 0.40       # [S] 120 mA @3.3 V at +20 dBm (PA_BOOST)
beacon_rx_w        = 0.034      # [S] 10.3 mA @3.3 V receive
beacon_period_s    = 30         # [A] one beacon every 30 s
beacon_airtime_s   = 0.5        # [A] LoRa packet time on air. Link budget (TPP 11b) needs SF >= 10 at +20 dBm; recompute airtime for the chosen SF
beacon_rx_duty     = 0.2        # [A] fraction of time listening for UHF commands
# --- OBC + TTC: ADRV9364-Z7020 SOM (Zynq-7020 + AD9364) ---
som_base_w         = 3.6        # [D] ~4 W/SOM field report (6 SOMs ~24 W, Linux, RX on) minus AD9364 RX
obc_accelerator_extra_w = 1.0   # [A] extra PL power while the inference accelerator runs
ad9364_rx_w        = 0.36       # [S] AD9364 RX 175-275 mA @1.3 V (upper)
ad9364_tx_w        = 0.64       # [S] AD9364 TX 160-490 mA @1.3 V (upper)
ttc_fdd            = false      # TX-only during passes (commands come over UHF)
pa_efficiency      = 0.31       # [S] QPA9940 PAE at +28 dBm. NOTE: QPA9940 covers 2300-2400 MHz only, not the
                                #     2245 MHz used in [link]; placeholder until the replacement PA is chosen (OI-25)
# --- Payload: 1U pushbroom hyperspectral imager (32 bands, 30 m GSD at 500 km) ---
imager_imaging_w   = 7.75       # [S] imager ICD, power table with compression, BOL (EOL 8.05)
imager_idle_w      = 4.50       # [S] imager ICD power table (control electronics on, sensor off)
imager_readout_w   = 4.50       # [S] imager ICD power table, readout mode (EOL 4.75)
imager_warmup_s    = 60         # [A] 5V_PAY on T-60 s; poll START-UP STATUS (0x83) until ready
eclipse_heater_w   = 0.5        # [A] battery heater in eclipse

[adcs]
# Own design modelled on CubeSpace parts; ADCS software runs on the OBC (no CubeComputer)
wheel_model        = CW0017     # [S] 1.77 mNms @6000 rpm, 0.23 mNm, 180 mW avg @2000 rpm, 0.85 W peak
torquer_x          = CR0002     # [A] custom rods sized like CubeSpace CR0002 (0.2 Am^2, 51 ohm)
torquer_y          = CR0003     # [A] like CR0003 (0.3 Am^2), resistance assumed 45 ohm
torquer_z          = CR0003
torquer_voltage    = 5.0
mtq_max_duty       = 0.8        # [A] leaves time for magnetometer sampling
computer_w         = 0.0        # ADCS runs on the Zynq (counted in som_base_w)
gyro_w             = 0.05       # [A] MEMS IMU
magnetometer_w     = 0.03       # [A] custom magnetometer (read by EPS MCU in detumble)
sun_sensor_w       = 0.10       # [S] CubeSense Sun average 100 mW
star_tracker       = false
star_tracker_w     = 0.192
residual_dipole_am2 = 0.005, 0.005, 0.01   # [A]
com_offset_m       = 0.0, 0.0, 0.0         # used only without [mass_budget]
dump_gain          = 0.002      # [A] 1/s
dyn_substep_s      = 0.1

[flightplan]
start              = mission    # mission | launch  (launch = separation -> deploy -> detumble -> mission)
deploy_inhibit_s   = 1800       # [A] CubeSat Design Spec: no deployables for 30 min after separation
rf_inhibit_s       = 2700       # [A] CubeSat Design Spec: no RF for 45 min (beacon starts then)
adcs_start_delay_s = 60         # [A] EPS MCU starts B-dot after deployments
panel_deploy_w     = 2.0        # [A] burn-wire power
panel_deploy_s     = 10         # [A]
antenna_deploy_w   = 2.0        # [A] turnstile burn wire
antenna_deploy_s   = 10         # [A]
mag_deploy_w       = 0          # custom magnetometer, no boom
mag_deploy_s       = 0
obc_on_during_detumble = false  # EPS-MCU-only detumbling; SOM boots after
obc_boot_s         = 60         # [A] SOM boot before wheels/sun acquisition
initial_omega_deg_s = 2, -2, 2  # [S] NASA/NanoRacks NRCSD tip-off target < 2 deg/s/axis
release_seed       = 1          # release attitude (vary for Monte Carlo)
detumble_exit_deg_s = 0.5       # [A]
detumble_hold_s    = 300        # [A]
bdot_period_s      = 1.0        # [A]
commissioning_hours = 0         # [A] no payload tasks until this long after detumble

[attitude]
sun_axis           = +Z         # body axis pointed at the Sun when charging
imager_axis        = -Z         # imager boresight
imager_along_track_axis = +Y    # pushbroom: detector line along X, so +Y along-track
antenna_axis       = -Z         # S-band patch boresight
max_rate_deg_s     = auto       # auto = 80% of wheel momentum / largest inertia
max_accel_deg_s2   = auto       # auto = 80% of wheel torque / largest inertia
settle_s           = 20
pointing_tolerance_deg = 2.0
eclipse_mode       = sun        # sun | nadir  (attitude held in eclipse)
idle_mode          = sun        # sun | nadir  (between tasks; nadir = continuous Earth pointing)

[payload]
pixels             = 4096       # [S]
bands              = 32         # [S]
bits               = 12         # [S]
gsd_m              = 30         # [S] at 500 km
gsd_ref_altitude_km = 500
swath_km           = 120        # [S] at 500 km
spatial_binning    = 1          # 1 = native 30 m; 4 = 4x4 binned (120 m)
compression_ratio  = 2          # [S] TPP v03 baseline: lossless CCSDS-123 measured 50-60 % reduction in flight on this
                                #     imager class (about 2:1). Use 4 only for lossy products the science team accepts
storage_gb         = 128        # [A] camera flash (MISSION.md; not stated in the imager ICDs - OI-04)
obc_storage_gb     = 32         # [A] OBC SD card / eMMC on the carrier
readout_mbps       = 100        # [S] imager control ICD: LVDS data link fixed at 100 Mbit/s (single lane)
readout_select_fraction = 1.0   # [A] share of captured data kept at readout (band/line filters); 8 of 31 bands = 0.26
sun_exclusion_deg  = 11         # [S] imager ICD: keep the Sun > 11 deg off the imager axis
max_sun_in_fov_s   = 900        # [S] imager ICD: <= 15 min continuous direct Sun, sensor unpowered
min_sun_elevation_deg = 20      # image only with the Sun this high at nadir
min_window_s       = 4
max_off_nadir_deg  = 0          # [S] imager ICD: line scan must be nadir; >0 only if the vendor allows roll (OI-01). A flown
                                #     6U mission with this imager class used up to +-20 deg in commissioning, mostly < 15 deg
scene_length_km    = 200        # [A] along-track strip per pass; sized so daily imaging ~ daily downlink (~0.5 GB)
initial_storage_gb = 1.0        # [A] data already in OBC storage at epoch
imaging_mode       = targets    # targets | continuous (image at nadir whenever the Sun is high enough)

[link]
freq_ghz           = 2.245      # S-band downlink (2200-2290 MHz SRS/EESS)
tx_power_w         = 0.63       # [S] +28 dBm: QPA9940 rated operating point (31% PAE)
antenna_gain_dbi   = 6.5        # [A] patch
antenna_hpbw_deg   = 70
tx_losses_db       = 3.0        # [A] cable + bandpass filter (~1 dB) + mismatch
gs_g_over_t_dbk    = 10.0       # [A] ~3 m S-band dish
path_losses_db     = 2.0        # atmosphere + polarisation + GS pointing
coding             = turbo_1_2  # uncoded | conv_rs | turbo_1_2 | turbo_1_3 | ldpc_7_8  (CCSDS 131.0-B)
max_symbol_rate_msps = 5.0      # [A] allowed QPSK symbol rate for your frequency assignment
frame_efficiency   = 0.97       # [A] ASM + TM frame header + CRC
implementation_loss_db = 2.0
required_margin_db = 3.0
rates_mbps         = 0.5, 1, 1.5, 2, 3, 4, 4.8, 6, 8   # candidate information rates
min_elevation_deg  = 10
priority           = imaging    # imaging | downlink when windows overlap

[ground_station]
name               = BITS Pilani
lat_deg            = 28.3639
lon_deg            = 75.5870
alt_m              = 300

[mass_budget]
# name = mass_kg, cx, cy, cz, sx, sy, sz [, shell]   (body frame, m; +Z = panel hinge end, -Z = imager)
Structure 3U (shell)   = 0.33,  0, 0, 0,        0.100, 0.100, 0.3405, 1   # [A]
Hyperspectral imager   = 0.51,  0, 0, -0.114,   0.098, 0.098, 0.113      # [S] 0.51 kg; ICD bay is 1.5U (OI-16)
S-band patch antenna   = 0.05,  0.025, 0.025, -0.168, 0.05, 0.05, 0.005  # [A]
CW0017 wheels x3       = 0.18,  0, 0, -0.035,   0.090, 0.090, 0.030      # [S] 60 g each
Magnetorquers x3       = 0.06,  0, 0, -0.010,   0.090, 0.090, 0.015      # [A] CR0002/3-class rods
Magnetometer + IMU     = 0.02,  0.03, 0, 0.005, 0.03, 0.03, 0.01         # [A]
ADRV9364-Z7020 + carrier = 0.11, 0, 0, 0.020,   0.095, 0.095, 0.020      # [A]
S-band PA + filter     = 0.05,  0, 0, 0.040,    0.090, 0.060, 0.012      # [A]
EPS board (SAMD21)     = 0.08,  0, 0, 0.058,    0.095, 0.095, 0.015      # [A]
Battery 2S2P 18650     = 0.226, 0, 0, 0.095,    0.090, 0.090, 0.070      # [S] 4 x ~46.5 g cells + bracket [A]
UHF RFM96W board       = 0.015, 0, 0, 0.135,    0.09, 0.09, 0.005        # [A]
Turnstile antenna      = 0.07,  0, 0, 0.165,    0.098, 0.098, 0.008      # [A]
CubeSense Sun          = 0.015, 0.03, -0.03, 0.172, 0.035, 0.022, 0.024  # [S] 15 g
Panel hinges + HDRM    = 0.04,  0, 0, 0.160,    0.100, 0.100, 0.020      # [A]
Harness + fasteners    = 0.15,  0, 0, 0,        0.090, 0.090, 0.320      # [A]
System margin (10%)    = 0.25,  0, 0, 0,        0.090, 0.090, 0.320      # [A]

[targets]
# name = lat_deg, lon_deg, radius_km
# A strip is imaged when any part of the area falls in the nadir swath.
# Invasive-flora study areas: [A] candidates until the faculty team fixes species and sites (OI-17)
Rajasthan Prosopis belt  = 26.50, 73.50, 250
Shekhawati (near GS)     = 28.40, 75.60, 100
Western Ghats Lantana    = 12.00, 76.00, 200
Central India Lantana    = 22.50, 80.00, 200
# Water-quality sites
Chilika Lake       = 19.72, 85.32, 30
Vembanad Lake      = 9.60, 76.40, 40
Sambhar Lake       = 26.93, 75.10, 15
Loktak Lake        = 24.55, 93.80, 12
Pulicat Lake       = 13.55, 80.18, 20
Wular Lake         = 34.36, 74.60, 12
Sundarbans coast   = 21.80, 88.90, 60
Gulf of Kutch      = 22.60, 69.80, 60
# Opportunistic strip on every daylight pass over India when no site above is in view [A]
India (opportunistic)    = 22.00, 79.00, 900
